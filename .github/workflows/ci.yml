name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PwaDrop.slnx
      - name: Build
        run: dotnet build PwaDrop.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PwaDrop.Core.Tests/PwaDrop.Core.Tests.csproj --configuration Release --no-build
      - name: Render settings UI
        run: |
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-settings artifacts/ui/PWADrop-settings.png
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-settings-min artifacts/ui/PWADrop-settings-min.png
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-about artifacts/ui/PWADrop-about.png
      - name: Primed original CF_HDROP self-test
        run: dotnet tests/PwaDrop.DragHarness/bin/Release/net10.0-windows10.0.26100.0/PwaDrop.DragHarness.dll --self-test
      - name: Publish self-contained MVP
        run: >-
          dotnet publish src/PwaDrop.App/PwaDrop.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
      - uses: actions/upload-artifact@v7
        with:
          name: PwaDrop-win-x64
          path: artifacts/publish/win-x64/
      - uses: actions/upload-artifact@v7
        with:
          name: PWADrop-settings-preview
          path: artifacts/ui/*.png
