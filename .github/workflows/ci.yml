name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PwaDrop.slnx
      - name: Build
        run: dotnet build PwaDrop.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PwaDrop.Core.Tests/PwaDrop.Core.Tests.csproj --configuration Release --no-build
      - name: Native source-hook tests
        shell: pwsh
        run: scripts/test-native-hook.ps1
      - name: Render settings UI
        run: |
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-settings artifacts/ui/PWADrop-settings.png
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-settings-min artifacts/ui/PWADrop-settings-min.png
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-settings-managed artifacts/ui/PWADrop-settings-managed.png
          dotnet src/PwaDrop.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/PwaDrop.dll --render-about artifacts/ui/PWADrop-about.png
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          if ($actual -ne $expected) { throw "Unexpected Inno Setup installer hash: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Build single-EXE installer
        shell: pwsh
        run: scripts/package-installer.ps1
      - name: Smoke-test per-user installer
        shell: pwsh
        run: scripts/test-installer.ps1 -SkipLaunch
      - name: Build Microsoft Store upload package
        shell: pwsh
        run: scripts/package-msix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PWADrop-installer-win-x64
          path: artifacts/installer/*/output/*
      - uses: actions/upload-artifact@v7
        with:
          name: PWADrop-microsoft-store-x64
          path: |
            artifacts/store/*/*.msixupload
            artifacts/store/*/*.msix
            artifacts/store/*/*.sha256
            artifacts/store/*/store-package-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: PWADrop-settings-preview
          path: artifacts/ui/*.png
